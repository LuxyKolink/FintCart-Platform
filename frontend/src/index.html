<!doctype html>
<html lang="es-CO">
  <head>
    <meta charset="utf-8" />
    <title>FintCart — Educación financiera</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!--
      `description` es lo que el buscador enseña bajo el título: sin ella, el
      resultado lo inventa el motor a partir del primer texto que encuentra, y en un
      SPA eso es el marcado del armazón. Describe el producto en una frase, sin
      enumerar palabras clave.
    -->
    <meta
      name="description"
      content="FintCart es una plataforma de educación financiera: calculadoras de ahorro, crédito e inversión que muestran el resultado paso a paso, cuestionarios para practicar y artículos para decidir con cifras."
    />
    <link rel="icon" type="image/svg+xml" href="assets/logo/fintcart-mark.svg" />
    <!--
      Configuración de tiempo de ejecución (URL del API y cliente OAuth).

      Va en `head` y ANTES del bundle a propósito: `main.ts` la lee al arrancar para
      sobrescribir lo compilado, y un script clásico en `head` se ejecuta antes que los
      módulos del bundle (que van diferidos). Sirve el mismo fichero tanto el servidor de
      desarrollo como nginx en el despliegue.
    -->
    <script src="/config.js"></script>
  </head>
  <body>
    <fc-root></fc-root>
  </body>
</html>
