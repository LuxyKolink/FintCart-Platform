<section class="fc-module" style="max-width: 420px; margin: var(--space-8) auto">
  <header>Crea tu cuenta</header>
  <div class="fc-module-body">
    @if (done()) {
      <p class="fc-banner fc-banner--success">
        ¡Listo! Te enviamos un correo de verificación. Ábrelo para activar tu cuenta.
      </p>
      <a class="fc-btn fc-btn--secondary fc-btn--block" routerLink="/iniciar-sesion">Ir a iniciar sesión</a>
    } @else {
      @if (errorMessage()) {
        <p class="fc-banner fc-banner--error">{{ errorMessage() }}</p>
      }
      <form [formGroup]="form" (ngSubmit)="onSubmit()">
        <div class="fc-field">
          <label class="fc-label" for="displayName">Nombre para mostrar</label>
          <input class="fc-input" id="displayName" type="text" formControlName="displayName" autocomplete="name" />
        </div>
        <div class="fc-field">
          <label class="fc-label" for="email">Correo electrónico</label>
          <input class="fc-input" id="email" type="email" formControlName="email" autocomplete="email" />
        </div>
        <div class="fc-field">
          <label class="fc-label" for="password">Contraseña</label>
          <input class="fc-input" id="password" type="password" formControlName="password" autocomplete="new-password" />
          <span class="fc-help">Mínimo 12 caracteres.</span>
        </div>
        <button class="fc-btn fc-btn--primary fc-btn--block" type="submit" [disabled]="submitting()">
          {{ submitting() ? 'Creando cuenta…' : 'Crear cuenta' }}
        </button>
      </form>
      <p class="fc-help" style="margin-top: var(--space-4)">
        ¿Ya tienes cuenta? <a routerLink="/iniciar-sesion">Inicia sesión</a>
      </p>
    }
  </div>
</section>
