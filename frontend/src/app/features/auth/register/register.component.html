<fc-auth-layout heading="Crea tu cuenta" subheading="Gratis, en menos de un minuto.">
  @if (done()) {
    <fc-banner tone="success">
      ¡Listo! Te enviamos un correo de verificación. Ábrelo para activar tu cuenta.
    </fc-banner>
    <fc-button variant="secondary" size="lg" [block]="true" routerLink="/iniciar-sesion">
      Ir a iniciar sesión
    </fc-button>
  } @else {
    @if (errorMessage()) {
      <fc-banner tone="error">{{ errorMessage() }}</fc-banner>
    }

    <form class="fc-auth__rows" [formGroup]="form" (ngSubmit)="onSubmit()">
      <fc-input
        label="Nombre para mostrar"
        type="text"
        formControlName="displayName"
        autocomplete="name"
      />
      <fc-input label="Correo electrónico" type="email" formControlName="email" autocomplete="email" />
      <fc-input
        label="Contraseña"
        type="password"
        formControlName="password"
        autocomplete="new-password"
        hint="Mínimo 12 caracteres."
      />

      <fc-checkbox
        label="Acepto la Política de Tratamiento de Datos Personales (Ley 1581 de 2012)."
        formControlName="consent"
      />

      <fc-button variant="primary" size="lg" [block]="true" type="submit" [disabled]="submitting()">
        {{ submitting() ? 'Creando cuenta…' : 'Crear cuenta' }}
      </fc-button>
    </form>

    <p class="fc-auth__alt">¿Ya tienes cuenta? <a routerLink="/iniciar-sesion">Inicia sesión</a></p>
  }
</fc-auth-layout>
