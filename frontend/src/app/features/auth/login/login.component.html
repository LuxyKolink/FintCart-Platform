<section class="fc-module" style="max-width: 420px; margin: var(--space-8) auto">
  <header>Inicia sesión</header>
  <div class="fc-module-body">
    @if (errorMessage()) {
      <p class="fc-banner fc-banner--error">
        {{ errorMessage() }}
        @if (needsVerification()) {
          <a routerLink="/auth/verify-email">Reenviar enlace de verificación</a>
        }
      </p>
    }

    <form [formGroup]="form" (ngSubmit)="onSubmit()">
      <div class="fc-field">
        <label class="fc-label" for="email">Correo electrónico</label>
        <input class="fc-input" id="email" type="email" formControlName="email" autocomplete="email" />
      </div>
      <div class="fc-field">
        <label class="fc-label" for="password">Contraseña</label>
        <input class="fc-input" id="password" type="password" formControlName="password" autocomplete="current-password" />
      </div>
      <button class="fc-btn fc-btn--primary fc-btn--block" type="submit" [disabled]="submitting()">
        {{ submitting() ? 'Entrando…' : 'Iniciar sesión' }}
      </button>
    </form>

    <p class="fc-help" style="margin-top: var(--space-4)">
      ¿No tienes cuenta? <a routerLink="/crear-cuenta">Crea una gratis</a>
    </p>
  </div>
</section>
