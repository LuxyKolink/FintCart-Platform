<fc-auth-layout heading="Inicia sesión" subheading="Bienvenido de nuevo a FintCart.">
  @if (errorMessage()) {
    <fc-banner tone="error">
      {{ errorMessage() }}
      @if (needsVerification()) {
        <a routerLink="/auth/verify-email">Reenviar enlace de verificación</a>
      }
    </fc-banner>
  }

  <form class="fc-auth__rows" [formGroup]="form" (ngSubmit)="onSubmit()">
    <fc-input
      label="Correo electrónico"
      type="email"
      formControlName="email"
      autocomplete="email"
      placeholder="tu@correo.com"
    />
    <fc-input
      label="Contraseña"
      type="password"
      formControlName="password"
      autocomplete="current-password"
    />

    <div class="fc-auth__between">
      <fc-checkbox label="Recordarme" formControlName="remember" />
      <a class="fc-auth__inline-link" routerLink="/auth/verify-email">¿Olvidaste tu contraseña?</a>
    </div>

    <fc-button variant="primary" size="lg" [block]="true" type="submit" [disabled]="submitting()">
      {{ submitting() ? 'Entrando…' : 'Iniciar sesión' }}
    </fc-button>
  </form>

  <p class="fc-auth__divider">o continúa con</p>

  <fc-button
    variant="secondary"
    size="lg"
    [block]="true"
    [disabled]="submitting()"
    (pressed)="onFederated()"
  >
    <fc-icon fcIconLeft name="shield" [size]="16" />
    OAuth2 · PKCE
  </fc-button>

  <p class="fc-auth__alt">¿No tienes cuenta? <a routerLink="/crear-cuenta">Regístrate</a></p>
</fc-auth-layout>
