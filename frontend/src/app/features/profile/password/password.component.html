<section class="fc-module" style="max-width: 420px">
  <header>Cambiar contraseña</header>
  <div class="fc-module-body">
    @if (done()) {
      <p class="fc-banner fc-banner--success">
        Tu contraseña se actualizó. Por seguridad cerramos tu sesión actual — vuelve a iniciar sesión con la
        contraseña nueva.
      </p>
      <a class="fc-btn fc-btn--primary fc-btn--block" routerLink="/iniciar-sesion">Ir a iniciar sesión</a>
    } @else {
      @if (errorMessage()) {
        <p class="fc-banner fc-banner--error">{{ errorMessage() }}</p>
      }
      <form [formGroup]="form" (ngSubmit)="onSubmit()">
        <div class="fc-field">
          <label class="fc-label" for="currentPassword">Contraseña actual</label>
          <input
            class="fc-input"
            id="currentPassword"
            type="password"
            formControlName="currentPassword"
            autocomplete="current-password"
          />
        </div>
        <div class="fc-field">
          <label class="fc-label" for="newPassword">Contraseña nueva</label>
          <input
            class="fc-input"
            id="newPassword"
            type="password"
            formControlName="newPassword"
            autocomplete="new-password"
          />
          <span class="fc-help">Mínimo 12 caracteres.</span>
        </div>
        <button class="fc-btn fc-btn--primary fc-btn--block" type="submit" [disabled]="submitting()">
          {{ submitting() ? 'Cambiando…' : 'Cambiar contraseña' }}
        </button>
      </form>
      <a class="fc-help" style="display: inline-block; margin-top: var(--space-4)" routerLink="/perfil">Cancelar</a>
    }
  </div>
</section>
