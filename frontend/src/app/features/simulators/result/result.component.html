<section class="fc-module" style="max-width: 480px">
  <header>Resultado</header>
  <div class="fc-module-body">
    <dl style="display: grid; grid-template-columns: 1fr auto; gap: var(--space-2) var(--space-4); margin: 0">
      @for (row of rows(); track row.label) {
        <dt class="fc-help">{{ row.label }}</dt>
        <dd class="fc-num" style="margin: 0; text-align: right">{{ row.value }}</dd>
      }
    </dl>
  </div>
</section>
