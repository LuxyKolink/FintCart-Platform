# Servidor de Autenticación — OAuth2 y emisión de JWT (Principio VII).
#
# Ruta crítica: sin él nadie obtiene token, así que el mínimo es de dos réplicas
# (D-12 / SC-012). `JWT_SIGNING_KEY` llega por Secret y NUNCA se versiona
# (Principio X).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth
  labels:
    app.kubernetes.io/name: auth
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: auth
  strategy:
    type: RollingUpdate
    rollingUpdate:
      # `maxUnavailable: 0` mantiene la capacidad durante el despliegue.
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: auth
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9090"
        prometheus.io/path: /metrics
    spec:
      # Mayor que el plazo de apagado ordenado del código (20 s): con un plazo menor,
      # Kubernetes mataría el proceso a mitad del drenaje.
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        fsGroup: 65532
      containers:
        - name: auth
          image: fintcart/auth:latest
          ports:
            - name: grpc
              containerPort: 50051
            - name: health
              containerPort: 9090
          envFrom:
            - configMapRef:
                name: fintcart-config
            - secretRef:
                name: fintcart-auth-secrets
          # Protege el arranque: sin ella, la sonda de vivacidad contaría desde el
          # segundo cero y un arranque lento reiniciaría el pod en bucle.
          startupProbe:
            httpGet:
              path: /healthz
              port: health
            failureThreshold: 30
            periodSeconds: 2
          # Vivacidad: NO consulta dependencias. Si comprobara PostgreSQL, una caída de
          # la base reiniciaría todas las réplicas a la vez.
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
            periodSeconds: 10
            failureThreshold: 3
          # Readiness: SÍ consulta las dependencias. Un pod que no puede trabajar deja
          # de recibir tráfico en lugar de responder errores.
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
            periodSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
---
apiVersion: v1
kind: Service
metadata:
  name: auth
  labels:
    app.kubernetes.io/name: auth
spec:
  selector:
    app.kubernetes.io/name: auth
  ports:
    - name: grpc
      port: 50051
      targetPort: grpc
    - name: health
      port: 9090
      targetPort: health
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: auth
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: auth
  # Repite el mínimo constitucional: sin él, el autoscaler bajaría a 1 en un valle de
  # tráfico y dejaría el servicio sin redundancia justo antes del pico siguiente.
  minReplicas: 2
  maxReplicas: 8
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: auth
spec:
  # Sin PDB, drenar un nodo puede llevarse las dos réplicas a la vez y el mínimo solo
  # se cumpliría en el papel.
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: auth
