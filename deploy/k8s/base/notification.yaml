# Servicio de Notificación — consumidor puro, canal email (Principio V, plan.md N-03).
#
# Una réplica en la base: un reinicio no pierde nada, porque los mensajes sin confirmar
# vuelven a la cola y la cola persistente conserva el estado de cada evento. El overlay
# de producción sube a dos; la reclamación por `UPDATE ... SKIP LOCKED` está diseñada
# para que varias réplicas se repartan el trabajo sin enviar el mismo correo dos veces.
#
# Sin puerto gRPC: es consumidor puro y no expone servicio.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification
  labels:
    app.kubernetes.io/name: notification
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: notification
  strategy:
    type: RollingUpdate
    rollingUpdate:
      # `maxUnavailable: 0` mantiene la capacidad durante el despliegue.
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: notification
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9090"
        prometheus.io/path: /metrics
    spec:
      # Mayor que el plazo de apagado ordenado del código (20 s): con un plazo menor,
      # Kubernetes mataría el proceso a mitad del drenaje.
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        fsGroup: 65532
      containers:
        - name: notification
          image: fintcart/notification:latest
          ports:
            - name: health
              containerPort: 9090
          envFrom:
            - configMapRef:
                name: fintcart-config
            - secretRef:
                name: fintcart-notification-secrets
          env:
            # El nombre de la cola es propio de cada consumidor, así que sale del
            # ConfigMap con la clave que le corresponde y no de una común.
            - name: AMQP_QUEUE
              valueFrom:
                configMapKeyRef:
                  name: fintcart-config
                  key: AMQP_QUEUE_NOTIFICATION
          # Protege el arranque: sin ella, la sonda de vivacidad contaría desde el
          # segundo cero y un arranque lento reiniciaría el pod en bucle.
          startupProbe:
            httpGet:
              path: /healthz
              port: health
            failureThreshold: 30
            periodSeconds: 2
          # Vivacidad: NO consulta dependencias. Si comprobara PostgreSQL, una caída de
          # la base reiniciaría todas las réplicas a la vez.
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
            periodSeconds: 10
            failureThreshold: 3
          # Readiness: SÍ consulta las dependencias. Un pod que no puede trabajar deja
          # de recibir tráfico en lugar de responder errores.
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
            periodSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
---
apiVersion: v1
kind: Service
metadata:
  name: notification
  labels:
    app.kubernetes.io/name: notification
spec:
  selector:
    app.kubernetes.io/name: notification
  ports:
    - name: health
      port: 9090
      targetPort: health
