version: v2

# Plantilla de generación para los cinco servicios Go.
#
# El prefijo de paquete Go difiere por servicio (cada uno es su propio módulo con
# su propio `gen/`, según plan.md §Project Structure), por lo que este archivo se
# invoca una vez por servicio sobreescribiendo el prefijo:
#
#   buf generate --template buf.gen.go.yaml \
#     --output ../services/users/gen \
#     --config buf.yaml
#
# `contracts/generate.sh` orquesta las cinco invocaciones. No editar `out` aquí:
# lo fija `--output` en cada llamada.

managed:
  enabled: true
  override:
    # Sin este override, protoc-gen-go falla porque los .proto no declaran
    # go_package. El prefijo real lo reescribe generate.sh por servicio.
    - file_option: go_package_prefix
      value: github.com/fintcart/platform/gen

# Plugins LOCALES, no remotos. Un plugin remoto obliga a subir la imagen del
# esquema (servicios, RPC, campos y comentarios) al servicio alojado de buf.build
# para ejecutarlo allí; los contratos de una plataforma financiera no salen de la
# máquina. Como efecto secundario la generación funciona sin red y es reproducible.
# Instalación de los binarios: contracts/generate.sh los verifica y documenta.
plugins:
  - local: protoc-gen-go
    out: .
    opt: paths=source_relative
  - local: protoc-gen-go-grpc
    out: .
    opt:
      - paths=source_relative
      - require_unimplemented_servers=false
