openapi: 3.0.3
info:
  title: Fintcart API Gateway (borde REST)
  version: 1.0.0
  description: >
    Único punto de entrada REST/HTTP del sistema (Constitución Principio II).
    Traduce HTTP/REST ↔ gRPC interno. Aplica CORS, rate limiting (Redis) y
    validación de tokens JWT (blacklist Redis) en cada solicitud.
    PRECISIÓN: todo monto/tasa se serializa como `string` decimal canónica
    (Principio VIII). PROHIBIDO número JSON para dinero.

servers:
  - url: https://api.fintcart.co/v1
    description: Producción
  # El borde local que levanta `dev/up`, SIN el prefijo `/v1`: en desarrollo no hay
  # nada delante del Gateway que lo añada, así que las rutas cuelgan de la raíz.
  # Está aquí y no solo en la documentación porque es lo que permite que el «Try it
  # out» de Swagger UI dispare peticiones reales contra la plataforma en marcha.
  - url: http://localhost:8080
    description: Desarrollo local (dev/up)

components:
  securitySchemes:
    oauth2PKCE:
      type: oauth2
      description: >
        OAuth2 Authorization Code + PKCE (cliente público SPA).
        Los dos endpoints los sirve ESTE Gateway y no un host aparte: el
        Principio II reserva toda la superficie REST al borde y el Servidor de
        Autenticación solo expone gRPC. Ver `/oauth/authorize` y `/oauth/token`
        en `paths:`, y la desviación documentada respecto de RFC 6749 §3.1
        (el endpoint de autorización es JSON, no una redirección de navegador,
        porque no existe ningún componente que pueda servir la página de login).
      flows:
        authorizationCode:
          authorizationUrl: https://api.fintcart.co/v1/oauth/authorize
          tokenUrl: https://api.fintcart.co/v1/oauth/token
          scopes:
            openid: Identidad básica
            learning: Acceso al módulo de aprendizaje
            simulator: Acceso a simuladores
            profile: Gestión de perfil
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >
        El mismo token que emite `/oauth/token`, presentado en la cabecera
        `Authorization`. No es un mecanismo de autenticación ALTERNATIVO —el único
        modo de obtener el token sigue siendo `oauth2PKCE`—, sino la descripción de
        cómo VIAJA una vez emitido, que es lo que el Gateway comprueba en cada
        petición contra la blacklist de Redis.

        Está declarado aparte porque el flujo `authorizationCode` de OpenAPI supone
        una redirección de navegador, y este `/oauth/authorize` responde JSON (ver la
        desviación de RFC 6749 §3.1 más arriba). Sin este esquema, un cliente de
        exploración como Swagger UI no ofrece dónde pegar el token y ninguna ruta
        autenticada se puede probar desde ahí.
  schemas:
    DecimalString:
      type: string
      pattern: '^-?\d+(\.\d+)?$'
      example: "1500000.00"
      description: Decimal canónico como string (nunca número JSON).
    Error:
      type: object
      properties:
        code: { type: string }
        message: { type: string }
    Progress:
      type: object
      properties:
        user_id: { type: string, format: uuid }
        points: { type: integer, minimum: 0 }
    Article:
      type: object
      properties:
        article_id: { type: string, format: uuid }
        title: { type: string }
        category: { type: string }
        body: { type: string }
        # Documento de bloques de la versión publicada (FR-063, research D-14),
        # serializado como JSON: el vocabulario es CERRADO y se valida en Aprendizaje al
        # guardar, no en el borde. Va como objeto y no como cadena para que el lector
        # reciba un árbol en vez de un texto que tenga que volver a analizar.
        # Ausente en artículos publicados antes de que existiera: el lector cae a `body`.
        body_doc: { type: object, additionalProperties: true }
        current_version_no: { type: integer }
    QuizGradeResult:
      type: object
      properties:
        attempt_id: { type: string, format: uuid }
        attempt_no: { type: integer }
        score: { $ref: '#/components/schemas/DecimalString' }
        passed: { type: boolean }
        points_after: { type: integer }
    SimulationResult:
      type: object
      properties:
        simulation_id: { type: string, format: uuid }
        result:
          type: object
          additionalProperties: { $ref: '#/components/schemas/DecimalString' }
    InAppNotification:
      type: object
      properties:
        id: { type: string, format: uuid }
        type: { type: string, enum: [nuevo_articulo, recordatorio, hito_progreso, resultado_cuestionario] }
        read_state: { type: string, enum: [unread, read] }
        created_at: { type: string, format: date-time }
        # El contenido de la tarjeta. Su forma depende de `type` y la decide quien
        # produce el evento, así que aquí es un objeto libre: describirlo con un
        # `oneOf` por tipo obligaría a tocar el contrato del borde cada vez que una
        # saga añade un dato al payload.
        #
        # Viaja como JSON ANIDADO y no como cadena con JSON dentro: el Gateway lo
        # valida antes de incrustarlo (ver `inAppToDTO`), de modo que el cliente no
        # tiene que volver a parsear una cadena para pintar la tarjeta.
        payload: { type: object, additionalProperties: true }

# Los dos esquemas en una lista son alternativas (OR), no requisitos acumulados: la
# petición vale si trae un token, con independencia de cómo se describa su obtención.
security:
  - oauth2PKCE: []
  - bearerAuth: []

paths:
  # --- OAuth2 (Principio VII). Públicas: sirven para OBTENER el token. ---
  /oauth/authorize:
    post:
      summary: Autenticar y emitir un authorization_code ligado al code_challenge (PKCE)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password, client_id, redirect_uri, code_challenge, code_challenge_method]
              properties:
                email: { type: string, format: email }
                password: { type: string, format: password }
                client_id: { type: string }
                redirect_uri: { type: string, format: uri }
                code_challenge: { type: string }
                code_challenge_method: { type: string, enum: [S256] }
                scopes: { type: array, items: { type: string } }
      responses:
        '200':
          description: Código de un solo uso
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: string }
                  redirect_uri: { type: string, format: uri }
        '400': { description: PKCE ausente o `code_challenge_method` distinto de S256 }
        '401': { description: Credenciales inválidas (mismo mensaje que cuenta inexistente) }
        '403': { description: Falta verificar el correo (FR-002) }

  /oauth/token:
    post:
      summary: Canjear authorization_code + code_verifier, o rotar un refresh token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [grant_type]
              properties:
                grant_type: { type: string, enum: [authorization_code, refresh_token] }
                code: { type: string }
                code_verifier: { type: string }
                client_id: { type: string }
                redirect_uri: { type: string, format: uri }
                refresh_token: { type: string }
      responses:
        '200':
          description: Par de tokens; el refresh SIEMPRE se rota (research D-05)
          content:
            application/json:
              schema:
                type: object
                properties:
                  access_token: { type: string }
                  refresh_token: { type: string }
                  token_type: { type: string, enum: [Bearer] }
                  # Segundos enteros: es el único número JSON del borde, y se
                  # permite porque no es un monto ni una tasa (Principio VIII).
                  expires_in: { type: integer }
        '400': { description: grant_type no soportado o parámetros incompletos }
        '401': { description: Código o refresh token inválido, caducado o reutilizado }

  # --- Identidad (proxy hacia Autenticación / Saga de registro en Orquestador) ---
  /auth/register:
    post:
      summary: Registro de usuario (inicia Saga de registro)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password, display_name]
              properties:
                email: { type: string, format: email }
                password: { type: string, format: password }
                display_name: { type: string }
      responses:
        '202': { description: Registro aceptado; correo de verificación enviado }
        '409': { description: Correo ya registrado, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }

  /auth/verify-email:
    post:
      # A diferencia de `/auth/register`, esta saga se ejecuta EN LÍNEA y responde 200,
      # no 202: su primer paso es el que comprueba el token, así que para cuando sale
      # la respuesta la cuenta ya está activa o el enlace ya se rechazó. Un 202 sería
      # engañoso en el único caso que importa — el usuario cerraría la pestaña
      # convencido de haber verificado una cuenta que quedó pendiente.
      summary: Verificación de correo (ejecuta la Saga de verificación)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [user_id, verification_token]
              properties:
                user_id: { type: string, format: uuid }
                # Token de un solo uso emitido por Autenticación y entregado por
                # correo. Es la única prueba de que quien verifica controla el buzón:
                # sin él bastaría conocer el `user_id` para activar una cuenta ajena.
                verification_token: { type: string }
      responses:
        '200':
          description: Correo verificado
          content:
            application/json:
              schema:
                type: object
                properties:
                  # Handle real de la saga ya ejecutada. Sirve para rastrearla en
                  # soporte, no para esperar a que termine.
                  saga_id: { type: string, format: uuid }
        '400': { description: Token inválido, ya usado o expirado }

  /auth/logout:
    post:
      summary: Cierre de sesión con revocación inmediata (FR-004)
      responses:
        '204': { description: Sesión revocada (jti en blacklist) }

  # --- Aprendizaje ---
  /catalog/articles:
    get:
      summary: Catálogo de artículos publicados (FR-010)
      parameters:
        - { name: category, in: query, schema: { type: string } }
        - { name: page_token, in: query, schema: { type: string } }
      responses:
        '200':
          description: Lista paginada
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Article' }

  /catalog/articles/{articleId}:
    get:
      summary: Leer artículo publicado (FR-011)
      parameters:
        - { name: articleId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: Artículo, content: { application/json: { schema: { $ref: '#/components/schemas/Article' } } } }
        '404': { description: No encontrado }

  /quizzes/{quizId}/attempts:
    post:
      summary: Enviar cuestionario (inicia Saga de calificación → progreso → notificar → auditar)
      parameters:
        - { name: quizId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                answers:
                  type: object
                  additionalProperties: { type: string }
      responses:
        '201':
          description: Intento calificado y registrado (FR-012/FR-016)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/QuizGradeResult' }

  # --- Editorial (roles editor / coordinador, FR-006..FR-008) ---
  /editorial/articles:
    post:
      summary: Crear borrador (rol editor)
      responses:
        '201': { description: Borrador creado }
  /editorial/versions/{versionId}/submit:
    post:
      summary: Enviar a revisión (rol editor)
      parameters:
        - { name: versionId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: En revisión }
  /editorial/versions/{versionId}/publish:
    post:
      summary: Aprobar y publicar (rol coordinador editorial; debe diferir del editor creador)
      parameters:
        - { name: versionId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: Publicado }
        '403': { description: El coordinador no puede ser el editor creador (FR-008) }
  /editorial/articles/{articleId}/versions:
    post:
      summary: Nueva versión en borrador de un artículo existente (FR-013, rol editor)
      description: >
        `title`/`category` no aplican: viven en el artículo y son compartidos por
        todas sus versiones. `version_no` es estrictamente incremental.
      parameters:
        - { name: articleId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '201': { description: Nueva versión en borrador creada }
  /editorial/versions/{versionId}:
    patch:
      summary: Editar el cuerpo de un borrador propio (rol editor)
      parameters:
        - { name: versionId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: Actualizado }
        '404': { description: No existe, no es un borrador propio, o ya no está en borrador }
  /editorial/versions/{versionId}/archive:
    post:
      summary: Archivar una versión publicada (rol editor o coordinador editorial)
      parameters:
        - { name: versionId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: Archivado }
  /editorial/versions:
    get:
      summary: Historial de versiones, bandeja de revisión o borradores propios (FR-013)
      description: >
        Una sola ruta con tres usos según qué filtros lleguen rellenos:
        `article_id` (historial de un artículo), `state=en_revision` (bandeja del
        coordinador) o `editor_id` (borradores propios).
      parameters:
        - { name: article_id, in: query, schema: { type: string, format: uuid } }
        - { name: state, in: query, schema: { type: string, enum: [borrador, en_revision, publicado, archivado] } }
        - { name: editor_id, in: query, schema: { type: string, format: uuid } }
        - { name: page_size, in: query, schema: { type: integer } }
        - { name: page_token, in: query, schema: { type: string } }
      responses:
        '200': { description: Página de versiones }
  /editorial/quizzes:
    post:
      summary: Crear un cuestionario para un artículo (FR-009, rol editor)
      responses:
        '201': { description: Cuestionario creado }
  /editorial/quizzes/{quizId}:
    put:
      summary: Reemplazar completo un cuestionario existente y sus preguntas (FR-009)
      description: >
        Reemplazo COMPLETO, no un CRUD por pregunta: la petición manda todas las
        preguntas que debe tener el cuestionario tras la llamada.
      parameters:
        - { name: quizId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: Cuestionario actualizado }

  # --- Simulador (vía Orquestador para auditoría, D-03) ---
  /simulators/{calcType}/run:
    post:
      summary: Ejecutar simulación financiera (FR-019..FR-022)
      description: >
        Las claves de `inputs` dependen del `calcType` y las define el Simulador,
        que es su dueño; el Gateway las pasa tal cual sin interpretarlas.

        LAS TASAS VAN COMO FRACCIÓN, NO COMO PORCENTAJE: `"0.185"` para un 18,5 %
        anual. La distinción importa porque no es detectable — `"18.5"` es un
        número perfectamente válido, se acepta con 200 y devuelve el resultado de
        un 1850 % anual. No hay heurística honesta que las separe: un 18,5 % y un
        1850 % son ambos representables, así que la convención tiene que estar
        escrita y respetarse en el cliente.
      parameters:
        - { name: calcType, in: path, required: true, schema: { type: string, enum: [ahorro, credito, presupuesto, inversion, colombia_especifica] } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                currency: { type: string, default: COP }
                inputs:
                  type: object
                  additionalProperties: { $ref: '#/components/schemas/DecimalString' }
      responses:
        '200':
          description: Resultado de simulación
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SimulationResult' }
  /simulators/history:
    get:
      summary: Historial de simulaciones del usuario (FR-022)
      responses:
        '200': { description: Lista paginada }

  # --- Perfil, progreso, bandeja in-app, derechos Ley 1581 ---
  /me/profile:
    get:
      summary: Consultar perfil y datos personales (FR-017/FR-029)
      responses:
        '200': { description: Perfil }
    patch:
      summary: Rectificar perfil/preferencias (FR-017/FR-029)
      responses:
        '200': { description: Actualizado }
  /me/progress:
    get:
      summary: Consultar progreso (FR-014)
      responses:
        '200': { description: Progreso, content: { application/json: { schema: { $ref: '#/components/schemas/Progress' } } } }
  /me/report:
    get:
      summary: Reporte estadístico de actividad (FR-018)
      responses:
        '200': { description: Reporte de actividad }
  /me/notifications:
    get:
      summary: Bandeja in-app con estado de lectura (FR-023)
      responses:
        '200':
          description: Lista de notificaciones in-app
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/InAppNotification' }
  /me/notifications/{id}/read:
    post:
      summary: Marcar notificación como leída
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '204': { description: Marcada como leída }
  /me/account:
    delete:
      summary: Solicitar eliminación de cuenta (Saga de anonimización, FR-030)
      responses:
        '202': { description: Solicitud aceptada; anonimización en proceso (SLA ≤ 15 días hábiles, SC-011) }
  /me/password:
    patch:
      summary: Cambiar la contraseña (FR-005). Exige la contraseña actual.
      responses:
        '200': { description: Contraseña actualizada; sesiones abiertas invalidadas }
        '401': { description: La contraseña actual no coincide }
  /me/data:
    get:
      summary: Consulta completa de datos personales del titular (FR-029) — perfil, progreso, historial de cuestionarios e historial de simulaciones.
      responses:
        '200': { description: Datos personales completos }

  # ═══════════════════════════════════════════════════════════════════════════
  # Enmienda 002 — constructor de calculadoras, administración y contenido
  # ═══════════════════════════════════════════════════════════════════════════
  #
  # Todas son del BORDE (Principio II): los servicios internos no ganan superficie
  # HTTP. Las de `/admin/**` exigen el rol `administrador` por middleware explícito
  # (FR-081) y las de `/editorial/calculators/**` el rol `coordinador_editorial`, NO
  # `administrador` (FR-082): aprobar contenido no es atribución del administrador.
  #
  # Ninguna ruta de depuración de cuentas aparece aquí: la Fase 9 se descartó, y un
  # contrato que describe una operación que el servicio no tiene es un deseo, no un
  # contrato. El diseño de esas rutas —incluido el `410` de la reactivación vencida—
  # queda en `specs/002-calculator-builder-content-admin/contracts/openapi/gateway-delta.yaml`.

  # ── Categorías del catálogo editorial (FR-032…FR-035) ──────────────────────
  /catalog/categories:
    get:
      summary: Categorías activas, ordenadas por `position` (público y desplegable del editor)
      security: []
      responses:
        '200': { description: Lista ordenada; la consume también la pantalla de acceso antes del login }

  /admin/categories:
    get:
      summary: Catálogo completo, incluidas las desactivadas (rol administrador)
      responses:
        '200': { description: Lista con `active` en cada elemento }
    post:
      summary: Crear categoría (FR-033)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string }
                slug: { type: string, description: 'Vacío ⇒ derivado del nombre' }
                description: { type: string }
                position: { type: integer, minimum: 0 }
      responses:
        '201': { description: Creada }
        '409': { description: Nombre o posición ya en uso entre las activas }

  /admin/categories/{categoryId}:
    patch:
      summary: Editar nombre, descripción u orden
      parameters:
        - { name: categoryId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: Actualizada }
        '404': { description: No encontrada }
    delete:
      summary: Desactivar (lógico, nunca borrado físico — FR-035)
      parameters:
        - { name: categoryId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '204': { description: Desactivada }
        '409':
          description: >
            Tiene artículos publicados. El cuerpo incluye `published_count` para que
            el mensaje al administrador diga CUÁNTOS, no solo que no se puede (FR-035).

  # ── Sesión de cuestionario (FR-038…FR-042) ────────────────────────────────
  /quizzes/{quizId}/session:
    post:
      summary: Iniciar intento; devuelve las N preguntas servidas (FR-038)
      parameters:
        - { name: quizId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '201':
          description: >
            Sesión creada: `session_id`, `expires_at` y las preguntas YA barajadas y
            SIN la clave correcta. El cliente no recibe el banco completo en ningún
            momento, ni siquiera para descartarlo.
        '404': { description: Cuestionario no publicado }

  # ── Imágenes de artículo (FR-064…FR-067) ──────────────────────────────────
  /editorial/articles/{articleId}/images:
    post:
      summary: Subir una imagen de artículo (rol editor)
      parameters:
        - { name: articleId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file: { type: string, format: binary }
      responses:
        '201': { description: 'Devuelve `image_id`, que es el SHA-256 del contenido' }
        '413': { description: Excede 2 MB }
        '415': { description: Tipo no admitido (solo jpeg, png, webp; se comprueba contra los BYTES, no contra el `Content-Type` declarado) }

  /media/images/{imageId}:
    get:
      summary: Servir una imagen
      security: []
      parameters:
        - { name: imageId, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: >
            Bytes de la imagen. `Cache-Control: public, max-age=31536000, immutable` y
            `ETag: "{imageId}"`. La caché agresiva es correcta precisamente porque el
            identificador ES el hash del contenido: una imagen distinta tiene otra URL.
        '404': { description: No encontrada }

  # ── Constructor de calculadoras (FR-043…FR-054) ───────────────────────────
  /calculators:
    get:
      summary: Catálogo de calculadoras publicadas (FR-052)
      security: []
      responses:
        '200': { description: Lista pública; cada elemento lleva su versión publicada }
    post:
      summary: Crear una calculadora propia (FR-043)
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, description: 'Definición: entradas, salidas y expresiones. Todo valor numérico viaja como string decimal.' }
      responses:
        '201': { description: Creada, en estado `privada` }
        '422':
          description: >
            Definición inválida. El cuerpo lleva `errors[]` con `location`, `code` y
            `message` por cada problema, no un mensaje único: FR-046 exige señalar el
            error concreto y dónde está.

  /calculators/validate:
    post:
      summary: Validar sin guardar; alimenta el aviso en vivo del constructor
      responses:
        '200': { description: Sin problemas }
        '422': { description: 'Mismo `errors[]` que al crear, sin persistir nada' }

  /calculators/{calculatorId}:
    get:
      summary: Obtener la definición
      parameters:
        - { name: calculatorId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: Definición con su versión }
        '404': { description: No encontrada o no visible para quien pregunta }
    put:
      summary: Reemplazar la definición (crea una versión nueva; no edita la anterior)
      parameters:
        - { name: calculatorId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: Versión nueva }
        '422': { description: Definición inválida }
    delete:
      summary: Eliminar una calculadora propia
      parameters:
        - { name: calculatorId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '204': { description: Eliminada }
        '403': { description: No es tuya }

  /calculators/{calculatorId}/run:
    post:
      summary: Ejecutar (FR-050). Misma saga que `/simulators/{calcType}/run`
      parameters:
        - { name: calculatorId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                inputs:
                  type: object
                  description: 'Un valor por nombre de entrada, como string decimal.'
                  additionalProperties: { type: string }
      responses:
        '200':
          description: >
            Resultados como `string` decimal, más `calculator_version` e
            `indicators_used` con el valor con que se calculó (FR-058). La versión y
            el snapshot viajan EN el resultado: es lo único que permite explicar un
            número años después sin volver a consultar el catálogo.
        '422': { description: 'Valor fuera de rango o regla de dominio incumplida (FR-044)' }
        '400': { description: 'Falta un indicador vigente para una fórmula que lo referencia' }

  /me/calculators:
    get:
      summary: Las calculadoras propias del usuario (FR-051)
      responses:
        '200': { description: 'Incluye el estado de cada una: privada, en revisión o publicada' }

  /calculators/{calculatorId}/submit:
    post:
      summary: Proponer una calculadora para el catálogo público (FR-052)
      parameters:
        - { name: calculatorId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: En revisión }
        '403': { description: No es tuya }

  /editorial/calculators:
    get:
      summary: Bandeja de calculadoras en revisión (rol coordinador_editorial)
      responses:
        '200': { description: 'Cada elemento marca `is_mine` si quien pregunta es el autor' }

  /editorial/calculators/{calculatorId}/approve:
    post:
      summary: Aprobar una calculadora (FR-053)
      parameters:
        - { name: calculatorId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: Publicada en el catálogo, con su versión aprobada }
        '403':
          description: >
            Quien aprueba es el propio autor (FR-053). La comprobación es del servidor:
            la bandeja marca «Tuya» pero NO oculta el botón, porque una barrera que
            consiste en no dibujar un botón no es una barrera.

  /editorial/calculators/{calculatorId}/reject:
    post:
      summary: Rechazar con motivo (FR-054)
      parameters:
        - { name: calculatorId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: 'Rechazada; el motivo llega al autor en la bandeja de notificaciones' }
        '403': { description: Quien rechaza es el propio autor }

  # ── Indicadores financieros (FR-059…FR-062) ───────────────────────────────
  /admin/indicators:
    get:
      summary: Listar indicadores y sus vigencias (rol administrador)
      responses:
        '200': { description: 'Valores como string decimal; vigencia como rango de fechas' }
    post:
      summary: Registrar los indicadores de un período (FR-060)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, value, valid_from, valid_to]
              properties:
                name: { type: string, description: 'En mayúsculas; es el nombre que las fórmulas referencian como @NOMBRE' }
                value: { type: string, description: 'String decimal (Principio VIII)' }
                valid_from: { type: string, format: date }
                valid_to: { type: string, format: date }
      responses:
        '201': { description: Registrado }
        '409': { description: 'Vigencia solapada para el mismo indicador (FR-059, `EXCLUDE USING gist`)' }

  /admin/indicators/{indicatorId}:
    put:
      summary: Corregir el valor o la vigencia
      parameters:
        - { name: indicatorId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: Corregido; el solape de vigencia también es 409 }
        '404': { description: No encontrado }

  /admin/indicators/status:
    get:
      summary: Estado del procedimiento anual — faltantes y próximos a vencer (rol administrador)
      responses:
        '200': { description: 'Lo que alimenta el correo de FR-061 y la pantalla de administración' }

  /indicators/current:
    get:
      summary: Indicadores vigentes hoy. Lo consume el frontend para el aviso de FR-062 antes de ejecutar
      security: []
      responses:
        '200': { description: 'Valores vigentes y `missing_names`: los que una fórmula podría necesitar y no están' }

  # GET /quizzes/{quizId} NO es de esta enmienda: existe desde 001 y se documenta aquí
  # porque faltaba, y un contrato incompleto se lee como si la ruta no existiera.
  # Después de 002 es la vista del EDITOR (banco completo, con la clave correcta); el
  # camino de ejecución es `POST /quizzes/{quizId}/session`.
  /quizzes/{quizId}:
    get:
      summary: Banco completo de un cuestionario (vista del editor; NO es el camino de ejecución)
      parameters:
        - { name: quizId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: Cuestionario con sus preguntas y opciones }
        '404': { description: No encontrado }
