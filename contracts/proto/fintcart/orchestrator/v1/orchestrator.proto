syntax = "proto3";

package fintcart.orchestrator.v1;

// El Orquestador no expone tipos de `common.v1`: sus RPC devuelven handles y
// estados de saga propios, nunca un OpResult genérico. Sí depende del contrato
// del Simulador para reutilizar `CalcType` en lugar de un entero sin tipo.
import "fintcart/simulator/v1/simulator.proto";

// Orquestador (Go). Coordina Sagas y compensaciones (Constitución Principio VI).
// SIN lógica de dominio: solo secuencia pasos gRPC y publica eventos (productor
// RabbitMQ → Auditoría/Notificación). Invocado por el API Gateway para flujos
// que cruzan ≥ 2 servicios.
service OrchestratorService {
  // Saga de registro (D-04): Users.CreateProfile + Auth.CreateCredential + email.
  rpc StartRegistration(StartRegistrationRequest) returns (SagaHandle);

  // Saga de verificación de correo: Users.MarkEmailVerified + Auth.ActivateCredential.
  rpc StartEmailVerification(EmailVerificationRequest) returns (SagaHandle);

  // Saga de calificación (D-07): Learning.GradeAndStoreAttempt + Users.ApplyQuizScore
  // + eventos QuizGraded(→Audit) y de actividad(→Notificación/in-app).
  rpc StartQuizGrading(QuizGradingRequest) returns (QuizGradingResult);

  // Simulación mediada para auditoría (D-03): Simulator.Compute + evento SimulationExecuted.
  rpc StartSimulation(SimulationRequest) returns (SimulationResult);

  // Saga de anonimización (FR-030/D-08): anonimiza Auth/Users/Learning/Simulator;
  // preserva Auditoría con actor_ref opaco.
  rpc StartAccountAnonymization(UserRef) returns (SagaHandle);

  // Aprobación de una calculadora al catálogo público (FR-053).
  //
  // Va por el Orquestador y no directo al Simulador por el mismo motivo que
  // `StartSimulation`: el Simulador NO es productor de eventos (Principio V) y la
  // aprobación tiene que quedar auditada. `calculator.published` es el rastro de quién
  // aprobó qué versión y cuándo, y sin él una calculadora aparecería en el catálogo sin
  // que nada diga cómo llegó.
  //
  // SÍNCRONA, como `StartSimulation`, y no un `SagaHandle`: el coordinador está esperando
  // el resultado de un clic, y devolverle un identificador de saga al que después preguntar
  // añadiría una consulta para una operación que dura una llamada.
  rpc ApproveCalculator(CalculatorApprovalRequest) returns (CalculatorApprovalResult);

  // Consulta de estado de una saga.
  rpc GetSagaStatus(SagaHandle) returns (SagaStatus);
}

message UserRef { string user_id = 1; }

message CalculatorApprovalRequest {
  string calculator_id = 1;
  // Coordinador editorial, y DISTINTO del autor (FR-053). El rol lo exige el borde, que
  // es el único sitio de la plataforma que conoce los roles; la separación de autoría la
  // imponen el Simulador y la base.
  string coordinator_id = 2;
}

message CalculatorApprovalResult {
  string calculator_id = 1;
  // Versión que esta aprobación publicó. El autor puede haber escrito versiones nuevas
  // mientras la propuesta esperaba, y la que se publica es la que se revisó.
  int32 version = 2;
}

message SagaHandle { string saga_id = 1; }
message SagaStatus {
  string saga_id = 1;
  string saga_type = 2;
  string status = 3; // running | completed | compensating | failed
  int32 current_step = 4;
}

message StartRegistrationRequest {
  string email = 1;
  string password = 2;
  string display_name = 3;
}

message EmailVerificationRequest {
  string user_id = 1;
  string verification_token = 2;
}

message QuizGradingRequest {
  string user_id = 1;
  string quiz_id = 2;
  map<string, string> answers = 3;
  // Sesión emitida por `Learning.StartQuizSession` (FR-038…FR-042). Obligatoria:
  // el intento solo se califica contra las preguntas servidas en esta sesión.
  string session_id = 4;
}
message QuizGradingResult {
  string attempt_id = 1;
  int32 attempt_no = 2;
  string score = 3; // [decimal]
  bool passed = 4;
  int32 points_after = 5; // progreso resultante
}

message SimulationRequest {
  string user_id = 1;
  // CAMBIO DE CONTRATO (FR-043): `calc_type` identifica una calculadora NATIVA.
  //
  // Reutiliza el enum del contrato del Simulador en lugar de un `int32` con el
  // tipo indicado en un comentario: si CalcType gana un valor, un entero suelto
  // seguiría aceptando cualquier número y el desajuste solo aparecería en
  // ejecución. El cambio es compatible a nivel de cable (ambos son varint).
  //
  // Es EXCLUYENTE con `calculator_id`, igual que en `ComputeRequest`: una
  // ejecución se identifica por el tipo nativo o por la definición, nunca por
  // los dos. El Simulador rechaza la petición que traiga ambos, así que un
  // llamador que los rellene por descuido falla de forma visible en vez de que
  // uno de los dos se ignore en silencio.
  fintcart.simulator.v1.CalcType calc_type = 2;
  string currency = 3;
  map<string, string> inputs = 4; // [decimal]
  // Calculadora DEFINIDA por un usuario (FR-043, camino preferente). Es lo que
  // permite que `/calculators/{id}/run` recorra esta misma saga en vez de llamar
  // al Simulador por su cuenta: la ejecución queda auditada (FR-025, D-03) porque
  // el único productor de `simulation.executed` es este servicio.
  //
  // Vacío ⇒ la ejecución va por `calc_type`.
  string calculator_id = 5;
}
message SimulationResult {
  string simulation_id = 1;
  map<string, string> result = 2; // [decimal]
}
