syntax = "proto3";

package fintcart.learning.v1;

import "fintcart/common/v1/common.proto";

// Servicio de Aprendizaje (TypeScript + NestJS). Dueño de artículos, versiones,
// cuestionarios e historial completo de intentos. Productor de eventos RabbitMQ
// (publicación de contenido) consumidos por Auditoría/Notificación.
service LearningService {
  // Curaduría (FR-007): editor crea/edita/versiona borradores y envía a revisión.
  rpc CreateDraft(CreateDraftRequest) returns (ArticleVersion);
  rpc UpdateDraft(UpdateDraftRequest) returns (ArticleVersion);
  rpc SubmitForReview(VersionRef) returns (fintcart.common.v1.OpResult);

  // Aprobación/publicación (FR-008): SOLO coordinador editorial y ≠ editor creador.
  rpc ApproveAndPublish(ApprovePublishRequest) returns (fintcart.common.v1.OpResult);
  rpc Archive(VersionRef) returns (fintcart.common.v1.OpResult);

  // Trazabilidad histórica (FR-013): historial de un artículo, bandeja de revisión
  // del coordinador (`state=en_revision`) y borradores propios de un editor
  // (`editor_id`), según qué filtros vengan rellenos — todos opcionales, vacío ⇒ sin
  // filtrar por ese campo (misma convención que `ListAttemptsRequest.quiz_id`).
  rpc ListVersions(ListVersionsRequest) returns (ListVersionsResponse);

  // Cuestionarios del flujo editorial (FR-009): reemplazo COMPLETO del cuestionario y
  // sus preguntas en una sola llamada, no un CRUD por pregunta — evita dejar un
  // cuestionario a medio editar visible entre dos llamadas. `quiz_id` vacío crea uno
  // nuevo.
  rpc UpsertQuiz(UpsertQuizRequest) returns (Quiz);

  // Catálogo y lectura (FR-010, FR-011). Incrementa estadística de vista (FR-018).
  rpc ListPublished(ListPublishedRequest) returns (ListPublishedResponse);
  rpc GetArticle(ArticleRef) returns (Article);

  // Imágenes del cuerpo del artículo (FR-064…FR-067, research D-13).
  //
  // `GetArticleImage` devuelve los BYTES, no una URL: el borde decide cómo servirlos
  // (T130 los sirve con `ETag` y caché inmutable). Aprendizaje no construye direcciones
  // ni conoce el Gateway, que es lo que permite que el lector y el editor usen la misma
  // ruta sin que el servicio sepa por dónde pasa.
  rpc UploadArticleImage(UploadArticleImageRequest) returns (ArticleImage);
  rpc GetArticleImage(ArticleImageRef) returns (GetArticleImageResponse);

  // Cuestionarios (FR-009).
  rpc GetQuiz(QuizRef) returns (Quiz);

  // Sesión de intento (FR-038…FR-042): SUSTITUYE a `GetQuiz` como camino de
  // ejecución. Devuelve SOLO las `questions_to_serve` preguntas servidas (o todas
  // si el banco tiene menos), con las opciones ya barajadas y SIN la clave
  // correcta. `GetQuiz` se conserva para la vista del editor, donde sí se
  // necesita el banco entero.
  rpc StartQuizSession(StartQuizSessionRequest) returns (QuizSession);

  // Calificación (FR-012/FR-016): persiste SIEMPRE el intento; lo invoca la Saga
  // de calificación (research D-07). Devuelve score y número de intento.
  rpc GradeAndStoreAttempt(GradeRequest) returns (GradeResponse);
  rpc ListAttempts(ListAttemptsRequest) returns (ListAttemptsResponse);

  // Saga de anonimización (FR-030): disocia PII de los intentos del usuario.
  rpc AnonymizeAttempts(UserRef) returns (fintcart.common.v1.OpResult);

  // Catálogo de categorías (FR-032…FR-035). Administración reservada al rol
  // administrador; el Gateway lo impone (FR-081).
  rpc CreateCategory(CreateCategoryRequest) returns (Category);
  rpc UpdateCategory(UpdateCategoryRequest) returns (Category);
  // Rechaza con FAILED_PRECONDITION si la categoría tiene artículos publicados,
  // incluyendo el recuento en el mensaje (FR-035).
  rpc DeactivateCategory(CategoryRef) returns (fintcart.common.v1.OpResult);
  // `include_inactive` solo lo usa la pantalla de administración; el desplegable
  // del editor y el catálogo público piden solo las activas.
  rpc ListCategories(ListCategoriesRequest) returns (ListCategoriesResponse);
}

message UserRef { string user_id = 1; }
message ArticleRef { string article_id = 1; }

// `article_id` y no solo los bytes: el ámbito de propiedad de una imagen es el artículo
// (data-model §1.4), así que una subida sin artículo no tiene dónde pertenecer.
message UploadArticleImageRequest {
  string article_id = 1;
  // Tipos de imagen que el contrato admite; se comprueban contra los BYTES y no contra
  // lo que declare el cliente (FR-066), porque un nombre de archivo y un `Content-Type`
  // los elige quien sube.
  string mime_type = 2;
  bytes bytes = 3;
  string uploaded_by = 4;
}

// El identificador ES el SHA-256 del contenido: quien lo tiene tiene los bytes, y el
// mismo contenido subido dos veces es la misma fila.
message ArticleImageRef { string image_id = 1; }

message ArticleImage {
  string image_id = 1;
  string article_id = 2;
  string mime_type = 3;
  string byte_size = 4; // string: es un conteo que puede pasar de 2^53 en un contrato futuro
  int32 width = 5;
  int32 height = 6;
}

message GetArticleImageResponse {
  ArticleImage image = 1;
  bytes bytes = 2;
}
message VersionRef { string version_id = 1; string actor_id = 2; }
message QuizRef { string quiz_id = 1; }

// Categorías del catálogo editorial (FR-032…FR-035). Referencia opaca por `id`;
// `slug` es el identificador legible para rutas y filtros.
message CategoryRef {
  string category_id = 1;
  string actor_id = 2; // rol administrador (FR-033)
}

message Category {
  string category_id = 1;
  string name = 2;
  string slug = 3;
  string description = 4;
  int32  position = 5;
  bool   active = 6;
}

message CreateCategoryRequest {
  string name = 1;
  string slug = 2;        // vacío ⇒ derivado del nombre
  string description = 3;
  int32  position = 4;
  string actor_id = 5;    // rol administrador (FR-033)
}

message UpdateCategoryRequest {
  string category_id = 1;
  string name = 2;
  string description = 3;
  int32  position = 4;
  string actor_id = 5;
}

message ListCategoriesRequest { bool include_inactive = 1; }
message ListCategoriesResponse { repeated Category items = 1; }

message ArticleVersion {
  string version_id = 1;
  string article_id = 2;
  int32 version_no = 3;
  string state = 4; // borrador | en_revision | publicado | archivado
  string created_by = 5;
  string approved_by = 6; // vacío hasta aprobación; DEBE diferir de created_by
  string created_at = 7;   // RFC-3339
  string published_at = 8; // RFC-3339; vacío si no está publicada (FR-013)
  // Presente en las cuatro respuestas (`CreateDraft`/`UpdateDraft`/`ApproveAndPublish`
  // vía OpResult no aplica; `ListVersions` sí): reabrir un borrador propio para seguir
  // editándolo exige poder leer su cuerpo actual, y no hay otro RPC que lo devuelva.
  string body = 9;
  // Documento de bloques (FR-063, research D-14), serializado como JSON. Es la ÚNICA
  // representación del cuerpo que se guarda: la columna `body` de `article_versions`
  // se eliminó en la migración `20260902150000` (T135), y el campo `body` de arriba
  // es una proyección de solo lectura que el servidor DERIVA de este documento para
  // los clientes anteriores a D-14. Esa proyección es deliberadamente pobre —no
  // representa negritas, ni imágenes, ni calculadoras incrustadas— y por eso va al
  // lado del documento: quien quiera el artículo, lo quiere a él.
  //
  // POR QUÉ TEXTO JSON Y NO UN `message BodyDoc` ANIDADO, aunque lo segundo parezca
  // más tipado: el vocabulario es CERRADO y se valida en el servidor (FR-068), y un
  // mensaje estructurado reparte esa validación entre el esquema y el validador. Con
  // un mensaje, un nodo o un atributo fuera del vocabulario no puede siquiera
  // expresarse en el contrato —lo cual suena bien hasta que se mira por dónde entra el
  // dato—: el cliente manda JSON al Gateway, el Gateway lo mapea al mensaje, y ese
  // mapeo descarta en silencio lo que no conoce. Un cliente con un atributo de más
  // recibiría «guardado» y perdería el atributo sin que nadie se lo dijera.
  //
  // Con el documento como texto, el Gateway transporta sin interpretar —que es su
  // papel (Principio II: sin dominio en el borde)— y Aprendizaje valida el árbol entero
  // en un solo sitio, rechazando con la ruta exacta del nodo culpable. Una validación,
  // un mensaje de error, un lugar donde arreglarlo.
  string body_doc = 10;
}

message CreateDraftRequest {
  string title = 1;
  // (existente) pasa a IGNORARSE (FR-034): la categoría vive ahora en el catálogo y se
  // referencia por `category_id`. Se conserva el número de campo para no romper a los
  // clientes actuales del Gateway mientras se migra la superficie.
  string category = 2;
  string body = 3;
  string editor_id = 4; // rol editor (FR-006)
  // Vacío: crea un artículo NUEVO (con su versión 1). No vacío: crea una nueva versión
  // en borrador de un artículo YA EXISTENTE (FR-013) — `title`/`category` se ignoran en
  // ese caso, porque viven en `articles` y son compartidos por todas sus versiones.
  string article_id = 5;
  // Obligatorio al crear artículo nuevo (FR-034): referencia al catálogo.
  string category_id = 6;
  // Documento de bloques serializado como JSON (FR-063). Vacío ⇒ el servidor deriva
  // el documento del texto de `body`, que es lo que hace un cliente que todavía no
  // sabe enviar bloques. No vacío ⇒ manda el documento y `body` se ignora: desde T135
  // lo único que se persiste es el documento, y el texto que el cliente manda por
  // separado no se guarda en ningún sitio (dos copias del cuerpo pueden contradecirse).
  string body_doc = 7;
}

message UpdateDraftRequest {
  string version_id = 1;
  string body = 2;
  string editor_id = 3;
  // Documento de bloques serializado como JSON (FR-063); misma regla que en
  // `CreateDraftRequest`: vacío ⇒ se deriva de `body`.
  string body_doc = 4;
}

message ApprovePublishRequest {
  string version_id = 1;
  string coordinator_id = 2; // rol coordinador_editorial; validar ≠ created_by (FR-008)
}

message ListPublishedRequest {
  // Nombre visible de la categoría (filtro heredado de 001, se conserva).
  string category = 1;
  fintcart.common.v1.PageRequest page = 2;
  // Filtro preferente por referencia al catálogo (FR-034); vacío ⇒ sin filtrar.
  string category_id = 3;
}
message ListPublishedResponse {
  repeated Article items = 1;
  fintcart.common.v1.PageResponse page = 2;
}

message Article {
  string article_id = 1;
  string title = 2;
  // Nombre visible de la categoría. Se conserva (número de campo 3) para no romper a
  // los consumidores actuales, y queda OBSOLETO en favor de `category_id` (FR-034).
  string category = 3;
  string body = 4;
  int32 current_version_no = 5;
  repeated string quiz_ids = 6;
  string category_id = 7; // referencia al catálogo (FR-034)
  // Documento de bloques de la versión vigente, serializado como JSON (FR-063). Es lo
  // que el lector renderiza bloque a bloque, por componente y sin `innerHTML` (FR-068).
  // Vacío ⇒ la versión es anterior al documento de bloques y el lector cae a `body`.
  string body_doc = 8;
}

message Quiz {
  string quiz_id = 1;
  string article_id = 2;
  string title = 3;
  string pass_threshold = 4; // [decimal]
  repeated Question questions = 5;
  // Número de preguntas a servir en cada intento (FR-037). > 0.
  int32 questions_to_serve = 6;
}
message Question {
  string question_id = 1;
  string prompt = 2;
  repeated Option options = 3;
  string weight = 4; // [decimal]
}

// Option es una alternativa de respuesta.
//
// Lleva CLAVE y texto, no solo el texto. `GradeRequest.answers` mapea
// `question_id -> option_key`, así que un cliente que recibiera únicamente los
// enunciados no tendría con qué responder: el cuestionario sería literalmente
// incontestable. Es el mismo par que guarda la columna `questions.options`
// (JSONB `{clave: enunciado}`) del esquema de Aprendizaje.
message Option {
  string key = 1;
  string text = 2;
}

// Sesión de intento de cuestionario (FR-038…FR-042, D-17). Vive en `learning_db`;
// caduca a los 60 minutos de crearse y solo puede calificarse una vez.
message StartQuizSessionRequest {
  string user_id = 1;
  string quiz_id = 2;
}

message QuizSession {
  string session_id = 1;
  string quiz_id = 2;
  string title = 3;
  // Porcentaje sobre 100 (FR-041). Viaja como `string` decimal.
  string pass_threshold = 4; // [decimal]
  string expires_at = 5;     // RFC-3339 (research D-17)
  // Exactamente `questions_to_serve` elementos, o todas las del banco si tiene
  // menos (FR-038). Ya vienen en el orden servido y con las opciones barajadas;
  // ninguna lleva `correct_key`.
  repeated Question questions = 6;
}

message GradeRequest {
  string user_id = 1;
  string quiz_id = 2;
  map<string, string> answers = 3; // question_id -> option_key
  // Opcional. Si se repite la MISMA clave, `GradeAndStoreAttempt` devuelve el
  // intento ya guardado en vez de crear uno nuevo (T176): el motor de sagas del
  // Orquestador reintenta un paso cuyo avance no llegó a confirmarse, y sin esta
  // clave ese reintento dejaría un intento fantasma en el historial (FR-016). Un
  // cliente directo (fuera de una saga) puede dejarla vacía; cada llamada
  // guarda un intento nuevo, como antes.
  string idempotency_key = 4;
  // CAMBIO DE CONTRATO (FR-040, FR-042): OBLIGATORIO. Si `answers` contiene una
  // pregunta que no está en la sesión, o la sesión venció o ya fue consumida, el
  // RPC devuelve FAILED_PRECONDITION en vez de calificar.
  string session_id = 5;
}
message GradeResponse {
  string attempt_id = 1;
  int32 attempt_no = 2;
  string score = 3; // [decimal] — porcentaje sobre 100 (FR-041)
  bool passed = 4;
  string session_id = 5;
}

message ListVersionsRequest {
  string article_id = 1; // vacío = cualquier artículo
  string state = 2;      // vacío = cualquier estado
  string editor_id = 3;  // vacío = cualquier editor (created_by)
  fintcart.common.v1.PageRequest page = 4;
}
message ListVersionsResponse {
  repeated ArticleVersion items = 1;
  fintcart.common.v1.PageResponse page = 2;
}

message QuestionInput {
  string prompt = 1;
  map<string, string> options = 2; // clave -> enunciado
  string correct_key = 3;
  string weight = 4; // [decimal]
}
message UpsertQuizRequest {
  string quiz_id = 1;    // vacío = crear
  string article_id = 2; // requerido al crear
  string title = 3;
  string pass_threshold = 4; // [decimal]
  repeated QuestionInput questions = 5;
  // Número de preguntas a servir por intento (FR-037); > 0.
  int32 questions_to_serve = 6;
}

message ListAttemptsRequest {
  string user_id = 1;
  // quiz_id VACÍO lista los intentos de TODOS los cuestionarios del usuario
  // (FR-016/FR-018/FR-029) — no se exige que sea UUID en ese caso.
  string quiz_id = 2;
  fintcart.common.v1.PageRequest page = 3;
}
message ListAttemptsResponse {
  message Attempt {
    string attempt_id = 1;
    int32 attempt_no = 2;
    string score = 3; // [decimal] — porcentaje sobre 100 (FR-041)
    string created_at = 4;
    // Preguntas servidas en este intento (FR-039), del `served_snapshot`.
    repeated string served_question_ids = 5;
  }
  repeated Attempt items = 1;
  fintcart.common.v1.PageResponse page = 2;
}
