syntax = "proto3";

package fintcart.simulator.v1;

import "fintcart/common/v1/common.proto";

// Servicio de Simulador (Rust). Calculadoras financieras con precisión decimal
// arbitraria (rust_decimal). NO es productor de eventos RabbitMQ (Principio V); la
// auditoría de simulaciones la emite el Orquestador (research D-03), y el aviso de
// vencimiento de indicadores también (research D-23).
// Todos los montos/tasas viajan como `string` decimal canónica (Principio VIII / D-10).
service SimulatorService {
  // Ejecuta una simulación y persiste el historial (FR-019..FR-022).
  // Invocada por el Orquestador para permitir el evento de auditoría (D-03).
  rpc Compute(ComputeRequest) returns (ComputeResponse);

  // Historial de simulaciones por usuario (FR-022).
  rpc ListHistory(ListHistoryRequest) returns (ListHistoryResponse);

  // Saga de anonimización (FR-030): disocia PII del historial.
  // CAMBIO DE COMPORTAMIENTO (002): además del historial, pone a NULL
  // `calculators.owner_id` de las calculadoras PUBLICADAS del titular,
  // conservándolas en el catálogo con autoría anonimizada (Edge Cases), y elimina
  // las privadas, que ya no tienen a quién servir.
  rpc AnonymizeHistory(UserRef) returns (fintcart.common.v1.OpResult);

  // ── Constructor de calculadoras (FR-043…FR-047) ───────────────────────────
  // Reemplazo COMPLETO de la definición en una sola llamada, no un CRUD por campo:
  // la misma razón por la que Aprendizaje hace UpsertQuiz de una pieza — evita
  // dejar una calculadora a medio editar visible entre dos llamadas.
  // `calculator_id` vacío crea una nueva.
  rpc UpsertCalculator(UpsertCalculatorRequest) returns (Calculator);
  rpc GetCalculator(CalculatorRef) returns (Calculator);
  // `owner_id` lista las propias; `only_published` el catálogo público. Vacío en
  // ambos ⇒ error: no existe un listado global sin filtrar (FR-051).
  rpc ListCalculators(ListCalculatorsRequest) returns (ListCalculatorsResponse);
  rpc DeleteCalculator(CalculatorRef) returns (fintcart.common.v1.OpResult);

  // Valida SIN guardar: alimenta el aviso en vivo del constructor en el frontend.
  // Devuelve los mismos errores que UpsertCalculator (FR-046).
  rpc ValidateDefinition(ValidateDefinitionRequest) returns (ValidateDefinitionResponse);

  // ── Curaduría (FR-052…FR-054) ─────────────────────────────────────────────
  rpc SubmitCalculatorForReview(CalculatorRef) returns (fintcart.common.v1.OpResult);
  // Valida coordinator_id ≠ owner_id (FR-053); también lo impone la base.
  rpc ApproveCalculator(ApproveCalculatorRequest) returns (fintcart.common.v1.OpResult);
  rpc RejectCalculator(RejectCalculatorRequest) returns (fintcart.common.v1.OpResult);

  // ── Indicadores financieros (FR-055…FR-060) ───────────────────────────────
  rpc UpsertIndicator(UpsertIndicatorRequest) returns (Indicator);
  rpc ListIndicators(ListIndicatorsRequest) returns (ListIndicatorsResponse);
  // Lo consulta el barrido periódico del Orquestador (research D-23), que es quien
  // publica el evento de aviso: el Simulador NO es productor (Principio V).
  rpc GetIndicatorCalendarStatus(fintcart.common.v1.PageRequest) returns (IndicatorCalendarStatus);
}

message UserRef { string user_id = 1; }

// Las cinco calculadoras del alcance (FR-019). Los valores DEBEN llevar el
// prefijo del nombre del enum: en proto3 los valores de enum comparten el
// espacio de nombres del paquete, no el del enum, así que `AHORRO` a secas
// colisionaría con cualquier otro enum del paquete que lo declarara.
//
// En la enmienda 002 estas cinco se resiembran como SIETE definiciones sobre el
// motor de fórmulas. `calc_type` se conserva como camino de compatibilidad, pero
// el camino preferente pasa a ser `calculator_id` (FR-043).
enum CalcType {
  CALC_TYPE_UNSPECIFIED = 0;
  CALC_TYPE_AHORRO = 1;
  CALC_TYPE_CREDITO = 2;
  CALC_TYPE_PRESUPUESTO = 3;
  CALC_TYPE_INVERSION = 4;
  CALC_TYPE_COLOMBIA_ESPECIFICA = 5;
}

message ComputeRequest {
  string user_id = 1;
  CalcType calc_type = 2;
  string currency = 3;              // default "COP" (FR-020)
  map<string, string> inputs = 4;   // [decimal] todos los montos/tasas como string
  // Opcional. Si se repite la MISMA clave, `Compute` devuelve la fila ya
  // guardada en vez de insertar una segunda (T176): el motor de sagas del
  // Orquestador reintenta un paso cuyo avance no llegó a confirmarse, y sin
  // esta clave ese reintento duplicaría la simulación en el historial. Un
  // cliente directo (fuera de una saga) puede dejarla vacía; en ese caso cada
  // llamada inserta una fila nueva, como antes.
  string idempotency_key = 5;
  // CAMBIO DE CONTRATO (FR-043): `calculator_id` es el camino PREFERENTE.
  // `calc_type` se mantiene por compatibilidad y se resuelve a la definición
  // semilla correspondiente. Exactamente uno de los dos debe venir relleno.
  string calculator_id = 6;
}

message ComputeResponse {
  string simulation_id = 1;
  map<string, string> result = 2;   // [decimal] resultados como string decimal canónica
  string computed_at = 3;           // RFC-3339
  // FR-050: la versión de la definición que produjo este resultado. Sin ella, el
  // historial no se puede explicar si la calculadora se editó después.
  int32 calculator_version = 4;
  // FR-058: snapshot de los indicadores usados, para que el resultado siga siendo
  // reproducible tras cambiar los indicadores (SC-019).
  map<string, string> indicators_used = 5;  // [decimal]
}

message ListHistoryRequest {
  string user_id = 1;
  fintcart.common.v1.PageRequest page = 2;
}
message ListHistoryResponse {
  message Entry {
    string simulation_id = 1;
    CalcType calc_type = 2;
    string currency = 3;
    map<string, string> inputs = 4;  // [decimal]
    map<string, string> result = 5;  // [decimal]
    string created_at = 6;
    // FR-058: la entrada se explica por sí sola, sin depender de la definición
    // vigente hoy.
    string calculator_id = 7;
    int32 calculator_version = 8;
    map<string, string> indicators_used = 9;  // [decimal]
  }
  repeated Entry items = 1;
  fintcart.common.v1.PageResponse page = 2;
}

// ─────────────────────────────────────────────────────────────────────────────
// Definición de calculadora
// ─────────────────────────────────────────────────────────────────────────────
message CalculatorRef { string calculator_id = 1; string actor_id = 2; }

// Tipo de un campo de entrada. NO existe un tipo texto: la única entrada de texto
// del sistema era el discriminador `operacion` de la calculadora colombiana, que
// research D-16 elimina al separarla en tres definiciones.
enum InputType {
  INPUT_TYPE_UNSPECIFIED = 0;
  INPUT_TYPE_MONTO = 1;
  INPUT_TYPE_TASA = 2;
  INPUT_TYPE_ENTERO = 3;
}

message CalculatorInput {
  string key = 1;
  string label = 2;
  InputType type = 3;
  string unit = 4;
  string min_value = 5;      // [decimal] vacío ⇒ sin cota inferior
  string max_value = 6;      // [decimal] vacío ⇒ sin cota superior
  string default_value = 7;  // [decimal]
  bool   required = 8;       // FR-044; opcional habilita presente(campo)
}

// Regla de validación de dominio, evaluada ANTES que las salidas. Separada de las
// fórmulas a propósito: es lo que permite el mensaje del autor ("el ingreso mensual
// debe ser mayor que cero") en vez de un genérico de división por cero.
message CalculatorValidation {
  string expression = 1;   // expresión booleana; DEBE cumplirse
  string message = 2;      // mensaje mostrado si no se cumple
}

message CalculatorOutput {
  string key = 1;
  string label = 2;
  string expression = 3;
  int32  scale = 4;        // decimales de redondeo half-even
  // Opcional. Si viene y evalúa a falso, la salida se OMITE. Necesario:
  // `inversion` solo emite `valor_futuro_real` si se dio `inflacion_anual`.
  string when = 5;
}

message CalculatorDefinition {
  repeated CalculatorInput inputs = 1;           // ≤ 20 (FR-046)
  repeated CalculatorValidation validations = 2;
  repeated CalculatorOutput outputs = 3;         // ≤ 10 (FR-046)
}

message Calculator {
  string calculator_id = 1;
  string owner_id = 2;       // vacío en las siete definiciones semilla
  string name = 3;
  string description = 4;
  bool   is_builtin = 5;
  string state = 6;          // privada | en_revision | publicada
  string approved_by = 7;
  string rejection_reason = 8;
  int32  version = 9;
  CalculatorDefinition definition = 10;
  repeated string indicators_used = 11;  // extraídos del AST al guardar
}

message UpsertCalculatorRequest {
  string calculator_id = 1;  // vacío ⇒ crear
  string owner_id = 2;
  string name = 3;
  string description = 4;
  CalculatorDefinition definition = 5;
}

message ListCalculatorsRequest {
  string owner_id = 1;
  bool   only_published = 2;
  fintcart.common.v1.PageRequest page = 3;
}
message ListCalculatorsResponse {
  repeated Calculator items = 1;
  fintcart.common.v1.PageResponse page = 2;
}

message ValidateDefinitionRequest { CalculatorDefinition definition = 1; }
message ValidateDefinitionResponse {
  bool valid = 1;
  // Vacío si valid. Cada error señala DÓNDE está el problema, no solo que lo hay:
  // FR-046 exige indicar el error concreto.
  repeated DefinitionError errors = 2;
}
message DefinitionError {
  string location = 1;   // p. ej. "outputs[1].expression" o "validations[0]"
  string code = 2;       // campo_inexistente | expresion_mal_formada |
                         // limite_excedido | indicador_desconocido |
                         // exponente_no_entero | funcion_desconocida |
                         // tipo_incompatible
  string message = 3;
}

message ApproveCalculatorRequest {
  string calculator_id = 1;
  string coordinator_id = 2;  // rol coordinador_editorial; ≠ owner_id (FR-053)
}
message RejectCalculatorRequest {
  string calculator_id = 1;
  string coordinator_id = 2;
  string reason = 3;          // obligatorio (FR-054)
}

// ─────────────────────────────────────────────────────────────────────────────
// Indicadores financieros
// ─────────────────────────────────────────────────────────────────────────────
message Indicator {
  string indicator_id = 1;
  string name = 2;          // ^[A-Z][A-Z0-9_]*$ — se referencia como @NOMBRE
  string value = 3;         // [decimal]
  string valid_from = 4;    // fecha ISO-8601, inclusive
  string valid_to = 5;      // fecha ISO-8601, EXCLUSIVA
  string registered_by = 6;
}

message UpsertIndicatorRequest {
  string indicator_id = 1;  // vacío ⇒ crear
  string name = 2;
  string value = 3;         // [decimal]
  string valid_from = 4;
  string valid_to = 5;
  string actor_id = 6;      // rol administrador (FR-060)
  // Solapamiento con otra vigencia del MISMO nombre ⇒ ALREADY_EXISTS (FR-059).
}

message ListIndicatorsRequest {
  string name = 1;          // vacío ⇒ todos
  string on_date = 2;       // vacío ⇒ todas las vigencias; si viene, la vigente
}
message ListIndicatorsResponse { repeated Indicator items = 1; }

message IndicatorCalendarStatus {
  // Indicadores SIN vigencia para la fecha actual (FR-062).
  repeated string missing_names = 1;
  // Indicadores cuya vigencia termina dentro de la ventana de aviso (FR-061).
  repeated ExpiringIndicator expiring = 2;
}
message ExpiringIndicator {
  string name = 1;
  string valid_to = 2;
  int32  days_remaining = 3;
}
