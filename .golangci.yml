# Configuración de lint compartida por los cinco servicios Go.
#
# La regla central es la prohibición de punto flotante binario para dinero y
# tasas (Constitución Principio VIII, NON-NEGOTIABLE): su violación es motivo de
# rechazo automático en revisión, así que se detecta estáticamente y no depende
# de que un revisor lo note.

version: "2"

run:
  timeout: 5m
  tests: true

linters:
  enable:
    - errcheck        # errores no comprobados
    - govet
    - ineffassign
    - staticcheck
    - unused
    - forbidigo       # Principio VIII: prohibición de float
    - wrapcheck       # Principio XI regla 6: errores envueltos con causa
    - contextcheck    # Principio XI regla 5: contexto propagado
    - noctx
    - bodyclose
    - rowserrcheck
    - sqlclosecheck
    - gosec
    - revive

  # `misspell` está DESHABILITADO a propósito. Solo trae un diccionario de
  # inglés, y los comentarios de este repositorio están en español, así que
  # marca como error cualquier palabra que se parezca a una inglesa mal escrita:
  # "columnas" → "columns", "conversiones" → "conversions". Son falsos positivos
  # que crecen con cada comentario nuevo, y silenciarlos uno a uno con
  # `ignore-words` es una lista interminable. Un linter que solo produce ruido
  # entrena al equipo a ignorar la salida del lint, que es peor que no tenerlo.

  settings:
    forbidigo:
      # ── Principio VIII (NON-NEGOTIABLE) ──────────────────────────────────
      # Prohibido float32/float64 y las conversiones que los introducen.
      # Usar github.com/shopspring/decimal para todo monto, tasa o porcentaje.
      forbid:
        - pattern: '^float32$'
          msg: "Principio VIII (NON-NEGOTIABLE): prohibido float32 para dinero o tasas. Usar shopspring/decimal."
        - pattern: '^float64$'
          msg: "Principio VIII (NON-NEGOTIABLE): prohibido float64 para dinero o tasas. Usar shopspring/decimal."
        - pattern: '^strconv\.ParseFloat$'
          msg: "Principio VIII: parsear decimales con decimal.NewFromString, no con ParseFloat."
        - pattern: '^strconv\.FormatFloat$'
          msg: "Principio VIII: serializar decimales con Decimal.String(), no con FormatFloat."
      analyze-types: true

    wrapcheck:
      ignore-sigs:
        - .Errorf(
        - errors.New(
        - errors.Unwrap(
        - errors.Join(
        - .Wrap(
        - .Wrapf(
        # `status.Error`/`status.Errorf` CREAN el error de la frontera gRPC, no lo
        # propagan: son el punto donde un error de dominio se traduce al código de
        # estado del contrato. Envolverlos sería justo lo contrario de lo que hay
        # que hacer — el mensaje que sale al cliente tiene que estar saneado,
        # porque la causa envuelta puede llevar nombres de tabla, fragmentos de SQL
        # o el detalle del driver. La causa completa va al log, no en la respuesta.
        - status.Error(
        - status.Errorf(

    revive:
      rules:
        - name: context-as-argument
        - name: error-return
        - name: error-strings
        - name: errorf
        - name: exported
          disabled: true

  exclusions:
    rules:
      # Los stubs generados desde contracts/proto no se editan a mano y usan
      # las convenciones de protoc, no las nuestras. Se regeneran, no se lintean.
      - path: 'gen/'
        linters: [forbidigo, wrapcheck, staticcheck, revive, gosec, unused]
      # En pruebas, envolver cada error añade ruido sin valor.
      - path: '_test\.go'
        linters: [wrapcheck, gosec, noctx]

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/fintcart/platform
