<!-- @dsCard group="Colors" viewport="700x150" name="Categorías" subtitle="Acentos temáticos del catálogo financiero" -->
<!doctype html><html lang="es"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;padding:20px;background:var(--surface-page);display:flex;gap:12px;flex-wrap:wrap}
  .cat{flex:1;min-width:120px;border:1px solid var(--border-default);border-radius:var(--radius-md);background:var(--surface-card);padding:12px;box-shadow:var(--shadow-xs)}
  .dot{width:14px;height:14px;border-radius:50%;margin-bottom:9px}
  .nm{font:var(--fw-bold) var(--fs-sm)/1.2 var(--font-sans);color:var(--text-strong)}
  .tk{font:var(--fw-medium) 10px/1.4 var(--font-mono);color:var(--text-faint);margin-top:3px}
</style></head>
<body>
  <div class="cat"><div class="dot" style="background:var(--cat-ahorro)"></div><div class="nm">Ahorro</div><div class="tk">--cat-ahorro</div></div>
  <div class="cat"><div class="dot" style="background:var(--cat-credito)"></div><div class="nm">Crédito</div><div class="tk">--cat-credito</div></div>
  <div class="cat"><div class="dot" style="background:var(--cat-presupuesto)"></div><div class="nm">Presupuesto</div><div class="tk">--cat-presupuesto</div></div>
  <div class="cat"><div class="dot" style="background:var(--cat-inversion)"></div><div class="nm">Inversión</div><div class="tk">--cat-inversion</div></div>
  <div class="cat"><div class="dot" style="background:var(--cat-colombia)"></div><div class="nm">Colombia</div><div class="tk">--cat-colombia</div></div>
</body></html>
