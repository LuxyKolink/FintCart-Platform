<!doctype html><html lang="es"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:22px;background:var(--surface-page);display:flex;gap:18px;align-items:flex-end;flex-wrap:wrap}
.u{display:flex;flex-direction:column;align-items:center;gap:7px}
.bar{background:var(--coral-300);border:1px solid var(--coral-400);border-radius:2px}
.tk{font:var(--fw-medium) 10px/1 var(--font-mono);color:var(--text-muted)}</style></head>
<body>
  <div class="u"><div class="bar" style="width:4px;height:4px"></div><span class="tk">1·4</span></div>

  <div class="u"><div class="bar" style="width:12px;height:12px"></div><span class="tk">3·12</span></div>
  <div class="u"><div class="bar" style="width:16px;height:16px"></div><span class="tk">4·16</span></div>
  <div class="u"><div class="bar" style="width:20px;height:20px"></div><span class="tk">5·20</span></div>
  <div class="u"><div class="bar" style="width:24px;height:24px"></div><span class="tk">6·24</span></div>
  <div class="u"><div class="bar" style="width:32px;height:32px"></div><span class="tk">7·32</span></div>
  <div class="u"><div class="bar" style="width:40px;height:40px"></div><span class="tk">8·40</span></div>
  <div class="u"><div class="bar" style="width:48px;height:48px"></div><span class="tk">9·48</span></div>

</body></html>
