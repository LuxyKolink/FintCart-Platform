<!-- @dsCard group="Colors" viewport="700x140" name="Neutros cálidos" subtitle="El papel del portal — warm-50 → warm-900" -->
<!doctype html><html lang="es"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;padding:20px;background:var(--surface-page)}
  .row{display:flex;border:1px solid var(--border-default);border-radius:var(--radius-md);overflow:hidden}
  .c{flex:1;height:72px;display:flex;align-items:flex-end;justify-content:center;padding-bottom:6px}
  .c span{font:var(--fw-semibold) 10px/1 var(--font-mono)}
</style></head>
<body>
  <div class="row">
    <div class="c" style="background:var(--warm-50)"><span style="color:#998A72">50</span></div>
    <div class="c" style="background:var(--warm-100)"><span style="color:#998A72">100</span></div>
    <div class="c" style="background:var(--warm-200)"><span style="color:#6E6353">200</span></div>
    <div class="c" style="background:var(--warm-300)"><span style="color:#4C4339">300</span></div>
    <div class="c" style="background:var(--warm-400)"><span style="color:#2E2822">400</span></div>
    <div class="c" style="background:var(--warm-500)"><span style="color:#fff">500</span></div>
    <div class="c" style="background:var(--warm-600)"><span style="color:#fff">600</span></div>
    <div class="c" style="background:var(--warm-700)"><span style="color:#fff">700</span></div>
    <div class="c" style="background:var(--warm-800)"><span style="color:#fff">800</span></div>
    <div class="c" style="background:var(--warm-900)"><span style="color:#fff">900</span></div>
  </div>
</body></html>
