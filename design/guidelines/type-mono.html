<!doctype html><html lang="es"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:22px;background:var(--surface-page)}
.tk{font:var(--fw-medium) var(--fs-2xs)/1.4 var(--font-mono);color:var(--text-faint);letter-spacing:.04em;margin-bottom:12px}
.num{font-family:var(--font-mono);font-variant-numeric:tabular-nums;color:var(--text-strong)}
.lbl{font:var(--fw-semibold) var(--fs-2xs)/1.3 var(--font-sans);color:var(--text-muted);text-transform:uppercase;letter-spacing:.06em}
.cell{display:flex;flex-direction:column;gap:4px}</style></head>
<body>
  <div class="tk">--font-mono · IBM Plex Mono · tabular-nums</div>
  <div style="display:flex;gap:34px;align-items:flex-end">
    <div class="cell"><span class="lbl">Saldo proyectado</span><span class="num" style="font-size:30px;font-weight:600">$ 12.480.500</span></div>
    <div class="cell"><span class="lbl">Tasa E.A.</span><span class="num" style="font-size:30px;font-weight:600">11,25 %</span></div>
    <div class="cell"><span class="lbl">Variación</span><span class="num" style="font-size:30px;font-weight:600;color:var(--value-up)">+4,8 %</span></div>
  </div>
</body></html>
