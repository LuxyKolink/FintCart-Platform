<!doctype html><html lang="es"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;background:var(--surface-page);display:grid;grid-template-columns:1fr 1fr}
.cell{padding:26px 24px;display:flex;align-items:center;gap:18px}
.dark{background:var(--warm-900)}
.word{font-family:var(--font-display);font-weight:700;font-size:30px;letter-spacing:-.5px}
.tk{font:var(--fw-medium) 10px/1.4 var(--font-mono);color:var(--text-faint);position:absolute;margin-top:60px}</style></head>
<body>
  <div class="cell">
    <img src="../assets/logo/fintcart-mark.svg" width="54" height="54">
    <span class="word" style="color:#1C1815">Fint<span style="color:var(--coral-400)">Cart</span></span>
  </div>
  <div class="cell dark">
    <img src="../assets/logo/fintcart-mark.svg" width="54" height="54">
    <span class="word" style="color:#FBF8F2">Fint<span style="color:var(--gold-400)">Cart</span></span>
  </div>
</body></html>
