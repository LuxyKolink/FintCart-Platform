<!doctype html><html lang="es"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:26px 22px;background:var(--surface-page);display:flex;gap:22px;flex-wrap:wrap}
.u{display:flex;flex-direction:column;align-items:center;gap:10px}
.box{width:96px;height:60px;background:var(--surface-card);border:1px solid var(--border-subtle);border-radius:var(--radius-md)}
.tk{font:var(--fw-medium) 10px/1.3 var(--font-mono);color:var(--text-muted)}</style></head>
<body>
  <div class="u"><div class="box" style="box-shadow:var(--shadow-xs)"></div><span class="tk">--shadow-xs</span></div>
  <div class="u"><div class="box" style="box-shadow:var(--shadow-sm)"></div><span class="tk">--shadow-sm</span></div>
  <div class="u"><div class="box" style="box-shadow:var(--shadow-md)"></div><span class="tk">--shadow-md</span></div>
  <div class="u"><div class="box" style="box-shadow:var(--shadow-lg)"></div><span class="tk">--shadow-lg</span></div>
  <div class="u"><div class="box" style="box-shadow:var(--shadow-pop)"></div><span class="tk">--shadow-pop</span></div>
</body></html>
