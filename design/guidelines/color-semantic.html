<!-- @dsCard group="Colors" viewport="700x150" name="Feedback semántico" subtitle="success · warning · danger · info" -->
<!doctype html><html lang="es"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;padding:20px;background:var(--surface-page);display:flex;gap:14px}
  .sw{flex:1;display:flex;flex-direction:column;gap:6px}
  .chip{height:48px;border-radius:var(--radius-sm);border:1px solid rgba(0,0,0,.08)}
  .soft{height:22px;border-radius:var(--radius-sm)}
  .nm{font:var(--fw-bold) var(--fs-xs)/1.3 var(--font-sans);color:var(--text-strong)}
  .tk{font:var(--fw-medium) 10px/1.3 var(--font-mono);color:var(--text-faint)}
</style></head>
<body>
  <div class="sw"><div class="chip" style="background:var(--success)"></div><div class="soft" style="background:var(--success-soft)"></div><div class="nm">Success</div><div class="tk">--success · growth green</div></div>
  <div class="sw"><div class="chip" style="background:var(--warning)"></div><div class="soft" style="background:var(--warning-soft)"></div><div class="nm">Warning</div><div class="tk">--warning</div></div>
  <div class="sw"><div class="chip" style="background:var(--danger)"></div><div class="soft" style="background:var(--danger-soft)"></div><div class="nm">Danger</div><div class="tk">--danger</div></div>
  <div class="sw"><div class="chip" style="background:var(--info)"></div><div class="soft" style="background:var(--info-soft)"></div><div class="nm">Info</div><div class="tk">--info · portal púrpura</div></div>
</body></html>
