<!doctype html><html lang="es"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:20px 22px;background:var(--surface-page)}
.row{display:flex;align-items:baseline;gap:16px;padding:5px 0;border-bottom:1px dotted var(--border-default)}
.row:last-child{border-bottom:0}
.tk{font:var(--fw-medium) 11px/1 var(--font-mono);color:var(--text-faint);width:130px;flex:none}
.sp{font-family:var(--font-display);color:var(--text-strong);font-weight:700}</style></head>
<body>
  <div class="row"><span class="tk">--fs-5xl · 48</span><span class="sp" style="font-size:48px">Finanzas</span></div>
  <div class="row"><span class="tk">--fs-3xl · 30</span><span class="sp" style="font-size:30px">Finanzas claras</span></div>
  <div class="row"><span class="tk">--fs-xl · 20</span><span class="sp" style="font-size:20px">Finanzas claras para todos</span></div>
  <div class="row"><span class="tk">--fs-base · 15</span><span style="font-family:var(--font-sans);font-size:15px;color:var(--text-body)">Texto base de interfaz y lectura</span></div>
  <div class="row"><span class="tk">--fs-xs · 12</span><span style="font-family:var(--font-sans);font-size:12px;color:var(--text-muted)">Metadatos, ayudas y pies</span></div>
</body></html>
