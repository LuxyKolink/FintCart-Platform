<!doctype html><html lang="es"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:22px;background:var(--surface-page);display:flex;gap:16px;flex-wrap:wrap}
.u{display:flex;flex-direction:column;align-items:center;gap:8px}
.box{width:64px;height:54px;background:var(--surface-card);border:1px solid var(--border-strong);box-shadow:var(--shadow-xs)}
.tk{font:var(--fw-medium) 10px/1.3 var(--font-mono);color:var(--text-muted);text-align:center}</style></head>
<body>
  <div class="u"><div class="box" style="border-radius:var(--radius-xs)"></div><span class="tk">xs · 2</span></div>
  <div class="u"><div class="box" style="border-radius:var(--radius-sm)"></div><span class="tk">sm · 4</span></div>
  <div class="u"><div class="box" style="border-radius:var(--radius-md)"></div><span class="tk">md · 6<br>default</span></div>
  <div class="u"><div class="box" style="border-radius:var(--radius-lg)"></div><span class="tk">lg · 8</span></div>
  <div class="u"><div class="box" style="border-radius:var(--radius-xl)"></div><span class="tk">xl · 12</span></div>
  <div class="u"><div class="box" style="border-radius:var(--radius-pill);width:78px"></div><span class="tk">pill</span></div>
</body></html>
