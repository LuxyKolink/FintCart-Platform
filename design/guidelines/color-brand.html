<!-- @dsCard group="Colors" viewport="700x190" name="Marca" subtitle="Coral primario · marigold acento · púrpura portal" -->
<!doctype html><html lang="es"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;padding:20px;background:var(--surface-page);display:flex;gap:14px}
  .sw{flex:1;border:1px solid var(--border-default);border-radius:var(--radius-md);overflow:hidden;box-shadow:var(--shadow-xs)}
  .chip{height:84px}
  .meta{padding:9px 11px;background:var(--surface-card)}
  .nm{font:var(--fw-bold) var(--fs-sm)/1.2 var(--font-sans);color:var(--text-strong)}
  .tk{font:var(--fw-medium) var(--fs-2xs)/1.4 var(--font-mono);color:var(--text-muted);margin-top:3px}
  .hx{font:var(--fw-medium) var(--fs-2xs)/1.4 var(--font-mono);color:var(--text-faint)}
</style></head>
<body>
  <div class="sw"><div class="chip" style="background:var(--coral-400)"></div><div class="meta"><div class="nm">Coral · Tomate</div><div class="tk">--brand-primary</div><div class="hx">#DE4D2B</div></div></div>
  <div class="sw"><div class="chip" style="background:var(--gold-400)"></div><div class="meta"><div class="nm">Marigold</div><div class="tk">--brand-accent</div><div class="hx">#EE9B00</div></div></div>
  <div class="sw"><div class="chip" style="background:var(--purple-500)"></div><div class="meta"><div class="nm">Púrpura portal</div><div class="tk">--brand-interactive</div><div class="hx">#6A1FB0</div></div></div>
</body></html>
