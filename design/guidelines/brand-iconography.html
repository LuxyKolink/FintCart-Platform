<!-- @dsCard group="Brand" viewport="700x170" name="Iconografía — Lucide" subtitle="Trazo 2px, redondeado; CDN" -->
<!doctype html><html lang="es"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:22px;background:var(--surface-page)}
.tk{font:var(--fw-medium) 10px/1.4 var(--font-mono);color:var(--text-faint);margin-bottom:14px}
.row{display:flex;gap:22px;flex-wrap:wrap}
.u{display:flex;flex-direction:column;align-items:center;gap:8px;width:78px}
.u i{color:var(--text-body)}
.nm{font:var(--fw-medium) 10px/1.2 var(--font-mono);color:var(--text-muted)}</style></head>
<body>
  <div class="tk">Lucide icons · stroke-width 2 · referenciado desde CDN (sustitución — ver README)</div>
  <div class="row">
    <div class="u"><i data-lucide="book-open" width="26" height="26"></i><span class="nm">book-open</span></div>
    <div class="u"><i data-lucide="piggy-bank" width="26" height="26"></i><span class="nm">piggy-bank</span></div>
    <div class="u"><i data-lucide="calculator" width="26" height="26"></i><span class="nm">calculator</span></div>
    <div class="u"><i data-lucide="trending-up" width="26" height="26"></i><span class="nm">trending-up</span></div>
    <div class="u"><i data-lucide="wallet" width="26" height="26"></i><span class="nm">wallet</span></div>
    <div class="u"><i data-lucide="bell" width="26" height="26"></i><span class="nm">bell</span></div>
    <div class="u"><i data-lucide="badge-check" width="26" height="26"></i><span class="nm">badge-check</span></div>
    <div class="u"><i data-lucide="file-text" width="26" height="26"></i><span class="nm">file-text</span></div>
  </div>
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
  <script>lucide.createIcons();</script>
</body></html>
