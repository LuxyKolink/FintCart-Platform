<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../../styles.css">
<style>
  body { margin: 0; padding: 22px; background: var(--surface-page); }
  .row { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; margin-bottom: 18px; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; max-width: 540px; }
  .lbl { font: var(--fw-bold) var(--fs-2xs)/1.4 var(--font-sans); letter-spacing: .08em; text-transform: uppercase; color: var(--text-faint); margin: 0 0 9px; }
</style>
</head>
<body>
<div id="root"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<script type="text/babel">
  const { Button, Input, Select, Checkbox } = window.FintCartDesignSystem_cf1e0c;
  function Demo() {
    return (
      <div>
        <p className="lbl">Botones — variantes</p>
        <div className="row">
          <Button variant="primary">Guardar</Button>
          <Button variant="accent">Empezar</Button>
          <Button variant="secondary">Cancelar</Button>
          <Button variant="ghost">Ver más</Button>
          <Button variant="danger">Eliminar</Button>
          <Button variant="primary" disabled>Deshabilitado</Button>
        </div>
        <p className="lbl">Tamaños</p>
        <div className="row">
          <Button size="sm" variant="primary">Pequeño</Button>
          <Button size="md" variant="primary">Mediano</Button>
          <Button size="lg" variant="primary">Grande</Button>
        </div>
        <div className="grid2">
          <Input label="Correo electrónico" type="email" placeholder="tu@correo.com" />
          <Input label="Monto" prefix="$" suffix="COP" placeholder="0" />
          <Select label="Categoría"><option>Ahorro</option><option>Crédito</option><option>Inversión</option></Select>
          <Input label="Contraseña" type="password" defaultValue="123" error="Mínimo 8 caracteres" />
        </div>
        <div className="row" style={{ marginTop: 18 }}>
          <Checkbox label="Recordarme" defaultChecked />
          <Checkbox label="Acepto la política de datos (Ley 1581)" />
        </div>
      </div>
    );
  }
  ReactDOM.createRoot(document.getElementById('root')).render(<Demo />);
</script>
</body>
</html>
